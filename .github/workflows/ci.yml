name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: benchmark
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U benchmark -d benchmark"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=retrieval_benchmark --cov-report=term-missing
      - name: Validate migration
        env:
          PGPASSWORD: benchmark
        run: psql -h localhost -U benchmark -d benchmark -f migrations/001_initial.sql
